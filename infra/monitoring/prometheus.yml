global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: coordinator
    metrics_path: /coord/metrics
    static_configs:
      - targets: [coordinator:8081]

  - job_name: workers
    metrics_path: /metrics
    static_configs:
      - targets: [worker-1:8090, worker-2:8090, worker-3:8090]

  - job_name: control-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [control-api:8080]
