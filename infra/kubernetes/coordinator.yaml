apiVersion: v1
kind: Service
metadata:
  name: coordinator
spec:
  selector:
    app: coordinator
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
spec:
  replicas: 1
  # No overlapping coordinators: the runtime supports one active instance only.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      # Otherwise Service/coordinator injects COORDINATOR_PORT=tcp://... over the numeric default.
      enableServiceLinks: false
      containers:
        - name: coordinator
          image: ghcr.io/vivektiwary-25/aetherstream-engine:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: aether-config
            - secretRef:
                name: aether-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /coord/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /coord/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /coord/health
              port: http
            periodSeconds: 10
            failureThreshold: 6
