apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  clusterIP: None
  selector:
    app: worker
  ports:
    - name: health
      port: 8090
      targetPort: health
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
spec:
  serviceName: worker
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: worker
          image: ghcr.io/vivektiwary-25/aetherstream-engine:dev
          imagePullPolicy: IfNotPresent
          command: [/app/bin/worker]
          ports:
            - name: health
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: aether-config
            - secretRef:
                name: aether-secret
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            failureThreshold: 6
