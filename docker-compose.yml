# Full local stack for contract 00. Network name is `aether`.
 
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  environment: &app-environment
    KAFKA_BOOTSTRAP: kafka:9092
    KAFKA_TOPIC: truck-events
    PG_URL: jdbc:postgresql://postgres:5432/aether
    PG_USER: aether
    PG_PASSWORD: ${PG_PASSWORD:-aether}
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aether}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-aether-secret}
    S3_BUCKET: aether-checkpoints
    COORDINATOR_URL: http://coordinator:8081
    SIMULATOR_URL: http://simulator:8070
    GIT_SHA: ${GIT_SHA:-dev}
    # Cap JVM heaps: the demo PC runs 10 containers; MaxRAMPercentage alone lets each JVM take 75% of the Docker VM.
    JAVA_OPTS: ${AETHER_JAVA_OPTS:--Xms64m -Xmx384m -XX:+ExitOnOutOfMemoryError}
  logging: *logging
  networks:
    - aether

x-worker: &worker
  <<: *app
  image: aether/engine:local
  # Coordinator owns the build; workers reuse its image without pulling.
  pull_policy: never
  entrypoint: ["/app/bin/worker"]
  depends_on:
    coordinator:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8090/health"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s
  restart: unless-stopped
  stop_grace_period: 5s

services:
  kafka:
    image: apache/kafka:4.3.2
    logging: *logging
    hostname: kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is for containers (kafka:9092). EXTERNAL is for the host (localhost:19092).
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Image VOLUME path, owned by appuser, so the named volume stays writable.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s
    networks:
      - aether
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.2
    logging: *logging
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic truck-events \
          --partitions 6 \
          --replication-factor 1
    restart: "no"
    networks:
      - aether

  postgres:
    image: postgres:17-alpine
    logging: *logging
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${PG_PASSWORD:-aether}
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aether", "-d", "aether"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - aether
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    logging: *logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-aether}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-aether-secret}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data
    # This image ships curl and mc. curl does not need an alias.
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - aether
    restart: unless-stopped

  minio-init:
    # pgsty/mc entrypoint is /usr/bin/mc (no shell). MC_HOST_* skips `mc alias set`.
    # Pin matches a published tag; do not float to latest.
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    logging: *logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-aether}:${S3_SECRET_KEY:-aether-secret}@minio:9000
    command: ["mb", "--ignore-existing", "local/aether-checkpoints"]
    restart: "no"
    networks:
      - aether

  coordinator:
    <<: *app
    image: aether/engine:local
    build:
      context: .
      dockerfile: infra/docker/engine.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      <<: *app-environment
      CHECKPOINT_INTERVAL_MS: "10000"
    ports:
      - "18081:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8081/coord/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  worker-1:
    <<: *worker
    environment:
      <<: *app-environment
      WORKER_ID: worker-1
      WORKER_QUEUE_CAPACITY: "32"

  worker-2:
    <<: *worker
    environment:
      <<: *app-environment
      WORKER_ID: worker-2
      WORKER_QUEUE_CAPACITY: "32"

  worker-3:
    <<: *worker
    environment:
      <<: *app-environment
      WORKER_ID: worker-3
      WORKER_QUEUE_CAPACITY: "32"

  simulator:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/simulator.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      <<: *app-environment
      SIM_SEED: "42"
      SIM_TIME_SCALE: "10"
      SIM_INITIAL_TRUCKS: "6"
    ports:
      - "18070:8070"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8070/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  control-api:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/control-api.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  web:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "8088:80"
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    mem_limit: 512m
    logging: *logging
    ports:
      - "19090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - aether

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    mem_limit: 256m
    logging: *logging
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - aether

networks:
  aether:
    name: aether

volumes:
  kafka-data:
  postgres-data:
  minio-data:
