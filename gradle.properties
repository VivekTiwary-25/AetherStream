org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Allow slow repository responses; retry transient transport failures, not missing artifacts.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
# Gradle 9.6 uses "tentatives" (total attempts), not "max.retries".
systemProp.org.gradle.internal.repository.max.tentatives=5
