<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Operations savepoint and restore wireframe</title><desc id="desc">Operations panel shows execution status, savepoint action, recent savepoints and restore confirmation.</desc><rect width="1440" height="900" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><text x="48" y="54" font-size="27" font-weight="700">AetherStream · Operations</text><rect x="40" y="82" width="1360" height="754" rx="12" fill="#f7f8f9" stroke="#65747e" stroke-width="2"/><text x="72" y="132" font-size="24" font-weight="700">Operations</text><rect x="1190" y="102" width="160" height="42" rx="8" fill="#edf3ee" stroke="#527256"/><text x="1233" y="130" font-size="18">RUNNING</text><text x="72" y="184" font-size="18">Execution 8f12 · generation 3 · active</text><rect x="72" y="218" width="240" height="52" rx="8" fill="#e4e8eb" stroke="#576771"/><text x="112" y="251" font-size="19" font-weight="700">Take savepoint</text><text x="338" y="251" font-size="17">Create a named recovery point at a completed checkpoint.</text><text x="72" y="324" font-size="22" font-weight="700">Recent savepoints</text><rect x="72" y="348" width="1296" height="78" rx="8" fill="#fff" stroke="#87939c"/><text x="100" y="380" font-size="18">savepoint-2026-11-19T09:14 · checkpoint #170</text><text x="100" y="408" font-size="16">COMPLETED · source offsets recorded</text><rect x="1170" y="362" width="160" height="48" rx="7" fill="#edf0f2" stroke="#576771"/><text x="1222" y="393" font-size="18">Restore</text><rect x="72" y="444" width="1296" height="78" rx="8" fill="#fff" stroke="#87939c"/><text x="100" y="476" font-size="18">savepoint-2026-11-19T08:57 · checkpoint #165</text><text x="100" y="504" font-size="16">COMPLETED · source offsets recorded</text><rect x="1170" y="458" width="160" height="48" rx="7" fill="#edf0f2" stroke="#576771"/><text x="1222" y="489" font-size="18">Restore</text><rect x="72" y="560" width="1296" height="230" rx="10" fill="#fff7e8" stroke="#89682d" stroke-width="2"/><text x="104" y="606" font-size="23" font-weight="700">Restart the pipeline from this savepoint?</text><text x="104" y="652" font-size="18">Current execution will restart from checkpoint #170. This may replay records</text><text x="104" y="682" font-size="18">since the savepoint; the latest outputs are preserved by deterministic upserts.</text><rect x="104" y="716" width="200" height="48" rx="7" fill="#e9e1d7" stroke="#725b3c"/><text x="128" y="747" font-size="18">Confirm restore</text><rect x="324" y="716" width="140" height="48" rx="7" fill="#edf0f2" stroke="#87939c"/><text x="360" y="747" font-size="18">Cancel</text><text x="72" y="816" font-size="16">Restore requires explicit confirmation; Operations status and pending/error feedback remain visible.</text></g></svg>