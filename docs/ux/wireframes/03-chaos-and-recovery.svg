<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Chaos and recovery wireframe</title><desc id="desc">Dashboard state after choosing a worker kill, with explicit confirmation, recovery banner, worker status and event timeline.</desc><rect width="1440" height="900" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><text x="44" y="48" font-size="26" font-weight="700">AetherStream · Execution demo</text><rect x="40" y="72" width="1360" height="82" rx="10" fill="#fff5df" stroke="#805d20" stroke-width="2"/><text x="66" y="106" font-size="21" font-weight="700">RECOVERING · execution 8f12 · generation 4</text><text x="66" y="135" font-size="17">Recovering from checkpoint #170 · worker death detected · results remain inspectable</text>
<rect x="40" y="176" width="450" height="375" rx="10" fill="#f7f8f9" stroke="#65747e" stroke-width="2"/><text x="66" y="216" font-size="22" font-weight="700">Chaos controls</text><text x="66" y="259" font-size="17">Inject a late event</text><rect x="66" y="275" width="206" height="46" rx="6" fill="#edf0f2" stroke="#87939c"/><text x="88" y="305" font-size="18">Send late events</text><text x="66" y="354" font-size="17">Slow down output</text><rect x="66" y="370" width="310" height="42" fill="#fff" stroke="#87939c"/><text x="84" y="398" font-size="17">200 ms per record ▾</text><rect x="66" y="438" width="180" height="48" rx="6" fill="#f2e6e6" stroke="#864c4c"/><text x="90" y="469" font-size="18">Kill worker</text><rect x="66" y="500" width="390" height="36" fill="#fff" stroke="#87939c"/><text x="82" y="524" font-size="16">Queues / backpressure visible in Workers</text>
<rect x="520" y="176" width="880" height="375" rx="10" fill="#f7f8f9" stroke="#65747e" stroke-width="2"/><text x="548" y="216" font-size="22" font-weight="700">Confirm worker kill</text><rect x="548" y="238" width="824" height="250" rx="8" fill="#fff" stroke="#7a5555" stroke-width="2"/><text x="580" y="284" font-size="21" font-weight="700">Kill worker w-03?</text><text x="580" y="324" font-size="18">This worker will crash without warning. Its partitions will be</text><text x="580" y="352" font-size="18">reassigned after recovery from the latest completed checkpoint.</text><text x="580" y="400" font-size="17">Worker: busiest (3 partitions)</text><rect x="580" y="426" width="170" height="44" rx="6" fill="#f2e6e6" stroke="#864c4c"/><text x="603" y="455" font-size="17">Confirm kill</text><rect x="768" y="426" width="130" height="44" rx="6" fill="#edf0f2" stroke="#87939c"/><text x="799" y="455" font-size="17">Cancel</text>
<rect x="40" y="574" width="1360" height="260" rx="10" fill="#f7f8f9" stroke="#65747e" stroke-width="2"/><text x="66" y="616" font-size="22" font-weight="700">Checkpoint &amp; recovery timeline · last 2 minutes</text><text x="68" y="657" font-size="16">Oldest</text><text x="1325" y="657" font-size="16">Newest</text><line x1="100" y1="708" x2="1345" y2="708" stroke="#7a858d" stroke-width="3"/><rect x="650" y="670" width="470" height="64" fill="#fff5df" stroke="#805d20"/><text x="672" y="698" font-size="17">Recovering from checkpoint #170 · generation 3 → 4</text><text x="780" y="759" font-size="17">✕ w-03 lost</text><text x="1130" y="759" font-size="17">✓ Recovered in 4.2 s</text><g stroke="#576771" stroke-width="4"><line x1="350" y1="690" x2="350" y2="730"/><line x1="590" y1="690" x2="590" y2="730"/><line x1="1190" y1="690" x2="1190" y2="730"/></g><text x="330" y="785" font-size="16">#168</text><text x="570" y="785" font-size="16">#170</text><text x="1170" y="785" font-size="16">#171</text><text x="66" y="817" font-size="16">Execution status and worker status are separate; state uses both label and color.</text></g></svg>