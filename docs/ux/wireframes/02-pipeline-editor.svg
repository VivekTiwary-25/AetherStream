<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Pipeline editor wireframe</title><desc id="desc">Pipeline dialog with operator palette, connected graph canvas, configuration inspector, validation and Run controls.</desc><rect width="1440" height="900" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><rect x="24" y="20" width="1392" height="858" rx="12" fill="#f7f8f9" stroke="#53636f" stroke-width="2"/><text x="52" y="62" font-size="27" font-weight="700">Pipeline editor</text><rect x="805" y="34" width="240" height="44" rx="7" fill="#fff" stroke="#83909a"/><text x="823" y="63" font-size="17">Examples: Truck city demo ▾</text><rect x="1065" y="34" width="125" height="44" rx="7" fill="#fff" stroke="#53636f"/><text x="1085" y="63" font-size="18">Validate</text><rect x="1205" y="34" width="175" height="44" rx="7" fill="#dce2e6" stroke="#53636f"/><text x="1247" y="63" font-size="18" font-weight="700">Run</text>
<rect x="42" y="102" width="215" height="550" fill="#eef1f3" stroke="#87939c"/><text x="62" y="137" font-size="21" font-weight="700">Operators</text><g font-size="18"><rect x="58" y="155" width="180" height="42" fill="#fff" stroke="#8a969e" rx="6"/><text x="76" y="182">Source</text><rect x="58" y="207" width="180" height="42" fill="#fff" stroke="#8a969e" rx="6"/><text x="76" y="234">Filter</text><rect x="58" y="259" width="180" height="42" fill="#fff" stroke="#8a969e" rx="6"/><text x="76" y="286">Map</text><rect x="58" y="311" width="180" height="42" fill="#fff" stroke="#8a969e" rx="6"/><text x="76" y="338">Key by</text><rect x="58" y="363" width="180" height="42" fill="#fff" stroke="#8a969e" rx="6"/><text x="76" y="390">Window</text><rect x="58" y="415" width="180" height="42" fill="#fff" stroke="#8a969e" rx="6"/><text x="76" y="442">Rule</text><rect x="58" y="467" width="180" height="42" fill="#fff" stroke="#8a969e" rx="6"/><text x="76" y="494">Sink</text></g>
<rect x="274" y="102" width="780" height="550" fill="#fff" stroke="#87939c"/><text x="298" y="137" font-size="20" font-weight="700">Graph canvas · drag blocks · connect ports</text><g fill="#f1f3f4" stroke="#63727d" stroke-width="2"><rect x="315" y="210" width="150" height="70" rx="8"/><rect x="515" y="210" width="140" height="70" rx="8"/><rect x="710" y="210" width="145" height="70" rx="8"/><rect x="900" y="210" width="125" height="70" rx="8"/><rect x="515" y="390" width="140" height="70" rx="8"/><rect x="710" y="390" width="145" height="70" rx="8"/><rect x="900" y="390" width="125" height="70" rx="8"/></g><g font-size="16" text-anchor="middle"><text x="390" y="240">Truck events</text><text x="390" y="263">SOURCE</text><text x="585" y="240">Position</text><text x="585" y="263">FILTER</text><text x="782" y="240">Key by truck</text><text x="782" y="263">KEY BY</text><text x="962" y="240">Speed sink</text><text x="962" y="263">SINK</text><text x="585" y="420">Delivery filter</text><text x="585" y="443">FILTER</text><text x="782" y="420">1 min window</text><text x="782" y="443">WINDOW</text><text x="962" y="420">Results sink</text><text x="962" y="443">SINK</text></g><g stroke="#586873" stroke-width="3" fill="none"><path d="M465 245H515M655 245H710M855 245H900M465 250Q480 425 515 425M655 425H710M855 425H900"/></g>
<rect x="1070" y="102" width="328" height="550" fill="#eef1f3" stroke="#87939c"/><text x="1092" y="137" font-size="21" font-weight="700">Configuration</text><text x="1092" y="185" font-size="17">Selected: 1 min window</text><text x="1092" y="225" font-size="16">Window size</text><rect x="1092" y="237" width="280" height="42" fill="#fff" stroke="#87939c"/><text x="1110" y="265" font-size="17">60000 ms</text><text x="1092" y="320" font-size="16">Aggregations</text><rect x="1092" y="332" width="280" height="100" fill="#fff" stroke="#87939c"/><text x="1110" y="362" font-size="16">avgSpeedKmh · avg</text><text x="1110" y="392" font-size="16">maxSpeedKmh · max</text><text x="1092" y="480" font-size="16">Pipeline JSON ▾</text><rect x="1092" y="492" width="280" height="130" fill="#fff" stroke="#87939c"/><text x="1110" y="522" font-size="15">{ nodes: […], edges: […] }</text>
<rect x="42" y="670" width="1356" height="184" rx="8" fill="#fff" stroke="#87939c"/><text x="66" y="710" font-size="22" font-weight="700">Validation · 2 errors</text><text x="66" y="750" font-size="18">TYPE_MISMATCH · Window needs a Key-by before it. Select node to inspect.</text><text x="66" y="788" font-size="18">INVALID_CONFIG · Window sizeMs must be between 1,000 and 3,600,000.</text><text x="66" y="830" font-size="16">Graph stays available while errors are corrected · Validate is separate from Run</text></g></svg>