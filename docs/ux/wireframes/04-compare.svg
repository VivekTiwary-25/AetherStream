<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Reference comparison wireframe</title><desc id="desc">Comparison panel shows checkpoint scope, run action, matched results and mismatch details in a table.</desc><rect width="1440" height="900" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17212b"><text x="48" y="54" font-size="27" font-weight="700">AetherStream · Correctness check</text><rect x="40" y="82" width="1360" height="754" rx="12" fill="#f7f8f9" stroke="#65747e" stroke-width="2"/><text x="72" y="130" font-size="24" font-weight="700">Reference comparison</text><text x="72" y="174" font-size="18">Compare engine output with the single-process reference using the same Kafka events.</text><text x="72" y="211" font-size="18">Scope: checkpoint #170 · replay from checkpoint 0 through latest completed checkpoint.</text><rect x="72" y="244" width="250" height="52" rx="8" fill="#e4e8eb" stroke="#576771"/><text x="108" y="278" font-size="19" font-weight="700">Compare with reference</text>
<rect x="72" y="326" width="1296" height="130" rx="8" fill="#edf3ee" stroke="#527256" stroke-width="2"/><text x="104" y="370" font-size="27" font-weight="700">MATCH · 4,812 / 4,812 results match</text><text x="104" y="414" font-size="18">Checkpoint #170 · 123,456 events replayed · 900 ms · no mismatches</text>
<text x="72" y="500" font-size="22" font-weight="700">Mismatch details (shown when present; capped at 50)</text><rect x="72" y="524" width="1296" height="54" fill="#e4e8eb" stroke="#71808c"/><g font-size="17" font-weight="700"><text x="92" y="558">Type</text><text x="242" y="558">Sink</text><text x="442" y="558">Key</text><text x="642" y="558">Window start</text><text x="862" y="558">Detail</text></g><g fill="#fff" stroke="#9aa4ab"><rect x="72" y="578" width="1296" height="58"/><rect x="72" y="636" width="1296" height="58"/><rect x="72" y="694" width="1296" height="58"/></g><g font-size="17"><text x="92" y="614">DIFFERENT</text><text x="242" y="614">speedSink</text><text x="442" y="614">truck-007</text><text x="642" y="614">1795251600000</text><text x="862" y="614">avgSpeedKmh differs: engine 0.8 / ref 0.9</text><text x="92" y="672">MISSING</text><text x="242" y="672">delSink</text><text x="442" y="672">truck-002</text><text x="642" y="672">1795251660000</text><text x="862" y="672">Expected window result is absent from engine</text><text x="92" y="730">EXTRA</text><text x="242" y="730">speedSink</text><text x="442" y="730">truck-004</text><text x="642" y="730">1795251720000</text><text x="862" y="730">Engine row not emitted by reference</text></g><text x="72" y="790" font-size="16">A match applies only to the displayed completed-checkpoint range; not a blanket guarantee.</text></g></svg>