name: ci-e2e

on:
  push:
    branches:
      - main
      - "task/**"
    paths-ignore:
      - "swarm/**"
      - "boss/**"
      - "boss/**"
      - "docs/**"
      - "**/*.md"
      - "web/public/expo-build.txt"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint demo script
        run: shellcheck infra/scripts/demo-e2e.sh

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Build and start stack
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker compose up -d --build
      - name: Run full-system demo
        env:
          EXPECT_SHA: ${{ github.sha }}
          E2E_EXTENDED: "1"
        run: bash infra/scripts/demo-e2e.sh
      # Keep the demo's worker-recovery evidence until all read-only proofs finish.
      - name: Show live expo proofs after worker recovery
        run: |
          set -o pipefail
          bash infra/scripts/expo-proofs.sh all | tee expo-proofs.txt
          for block in checkpoints manifest offsets fencing recovery; do
            grep -Fx "PROOF $block OK" expo-proofs.txt
          done
      - name: Run presenter pre-demo checklist
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: bash infra/scripts/expo-check.sh --ci http://localhost:18080
      - name: Check documented safe commands
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: bash infra/scripts/doc-commands-check.sh
      - name: Reset expo and verify demo readiness again
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: bash infra/scripts/expo-reset.sh --api http://localhost:18080
      - name: Verify demo readiness
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: bash infra/scripts/demo-ready.sh http://localhost:18080
      - name: Compose status
        if: always()
        run: docker compose ps
      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt 2>&1
      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            compose-logs.txt
            expo-proofs.txt
          if-no-files-found: warn
      # This job owns the stack lifetime, including cleanup after any failed check.
      - name: Tear down stack
        if: always()
        run: docker compose down -v
