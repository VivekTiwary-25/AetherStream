name: ci-kill-repeat

on:
  push:
    branches:
      - "task/**"
    paths:
      - "infra/scripts/kill-repeat.sh"
      - ".github/workflows/ci-kill-repeat.yml"
      - "docs/expo/kill-repeat.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint repeat-kill script
        run: shellcheck infra/scripts/kill-repeat.sh

  kill-repeat:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and start stack
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker compose up -d --build
      - name: Start demo pipeline and verify readiness
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: bash infra/scripts/demo-ready.sh http://localhost:18080
      - name: Kill workers repeatedly
        run: bash infra/scripts/kill-repeat.sh http://localhost:18080 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compose status
        if: always()
        run: docker compose ps
      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt 2>&1
      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kill-repeat-compose-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: compose-logs.txt
          if-no-files-found: warn
      - name: Tear down stack
        if: always()
        run: docker compose down -v
