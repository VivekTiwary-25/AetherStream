name: ci-compose

on:
  push:
    branches:
      - main
      - "task/**"
    paths-ignore:
      - "swarm/**"
      - "boss/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start whole stack
        run: docker compose up -d --build

      - name: Smoke
        run: bash infra/scripts/smoke.sh

      - name: Status
        if: always()
        run: docker compose ps -a

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
