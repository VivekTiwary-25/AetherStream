name: ci-coldstart

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-coldstart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coldstart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Build Compose images
        run: docker compose build
      - name: Measure cold start
        run: |
          bash infra/scripts/cold-start-timer.sh --from-cold | tee cold-start-output.txt
          grep '^|' cold-start-output.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Compose status
        if: always()
        run: docker compose ps -a
      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt 2>&1
      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coldstart-compose-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: compose-logs.txt
          if-no-files-found: warn
      - name: Tear down
        if: always()
        run: docker compose down -v
