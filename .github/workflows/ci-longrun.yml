name: ci-longrun

on:
  push:
    branches:
      - "task/**"
    paths:
      - ".github/workflows/ci-longrun.yml"
      - "infra/scripts/longrun.sh"
      - "docs/expo/long-run.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  longrun:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: ShellCheck monitor
        run: shellcheck --severity=warning infra/scripts/longrun.sh
      - name: Run 60-minute stability test
        env:
          GIT_SHA: ${{ github.sha }}
          EXPECT_SHA: ${{ github.sha }}
        run: bash infra/scripts/longrun.sh
      - name: Compose status
        if: always()
        run: docker compose ps
      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt 2>&1
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: longrun-csv-${{ github.run_id }}-${{ github.run_attempt }}
          path: longrun.csv
          if-no-files-found: warn
      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: longrun-compose-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: compose-logs.txt
          if-no-files-found: warn
      - name: Tear down stack
        if: always()
        run: docker compose down -v
