name: bench

on:
  workflow_dispatch:
  push:
    branches: [main, "task/**"]
    paths:
      - "engine/**"
      - "compiler/**"
      - "tests/**"
      - "benchmarks/**"
      - ".github/workflows/bench.yml"
      - "build.gradle.kts"
      - "gradle/**"
      - "reference/**"
      - "simulator/**"
      - "common/**"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run engine benchmark
        run: ./gradlew :tests:benchmarkTest --console=plain
      - name: Append benchmark summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/reports/benchmark/report.md ]]; then
            cat build/reports/benchmark/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Benchmark report unavailable: the run did not produce build/reports/benchmark/report.md. See the job logs and test results.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark reports and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-reports
          path: |
            build/reports/benchmark
            tests/build/reports/tests/benchmarkTest
            tests/build/test-results/benchmarkTest
          if-no-files-found: warn
