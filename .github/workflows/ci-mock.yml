name: ci-mock

on:
  push:
    branches: [main, "task/**"]
  pull_request:
    branches: [main]

jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install and smoke-test the dev mock server
        run: cd web/mock && npm install && node smoke.mjs
