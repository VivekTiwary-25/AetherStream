name: ci-integration

on:
  push:
    branches: [main, "task/**"]
    paths: ["common/**", "compiler/**", "reference/**", "engine/**", "control-api/**", "simulator/**", "tests/**", "infra/db/**", "gradle/**", "*.gradle.kts", ".github/workflows/ci-integration.yml"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    name: integration (${{ matrix.group }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the longest recovery workload separate from restart + savepoint continuation.
          - group: recovery
            tests: >-
              --tests io.aetherstream.tests.WorkerCrashRecoveryIT
              --tests io.aetherstream.tests.IncompleteCheckpointIT
              --tests io.aetherstream.tests.RescaleIT
              --tests io.aetherstream.tests.StaleWorkerFencingIT
              --tests io.aetherstream.tests.KafkaOffsetsLookupIT
              --tests io.aetherstream.tests.S3CheckpointStoreIT
          - group: continuation
            tests: >-
              --tests io.aetherstream.tests.CoordinatorRestartIT
              --tests io.aetherstream.tests.SavepointIT
              --tests io.aetherstream.tests.EngineMatchesReferenceIT
              --tests io.aetherstream.tests.ExactlyOnceSinkIT
              --tests io.aetherstream.tests.PostgresExecutionRepositoryIT
              --tests io.aetherstream.tests.WorkerAdaptersIT
              --tests io.aetherstream.tests.OrgAccessIT
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run integration tests
        run: ./gradlew :tests:integrationTest --console=plain ${{ matrix.tests }}
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports-${{ matrix.group }}
          path: |
            tests/build/reports
            tests/build/test-results
          if-no-files-found: ignore
