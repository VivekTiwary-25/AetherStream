name: ci-ui-e2e

on:
  push:
    branches:
      - main
      - 'task/**'
    paths:
      - 'web/**'
      - '!web/public/expo-build.txt'
      - 'control-api/**'
      - 'engine/**'
      - 'tests/ui/**'
      - '.github/workflows/ci-ui-e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - 'control-api/**'
      - 'engine/**'
      - 'tests/ui/**'
      - '.github/workflows/ci-ui-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Advisory until the editor/chaos/compare surfaces are integrated into the shell.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright project
        working-directory: tests/ui
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Install Chromium and system dependencies
        working-directory: tests/ui
        run: npx playwright install --with-deps chromium
      - name: Build and wait for real stack
        run: GIT_SHA=${{ github.sha }} docker compose up -d --build --wait
      - name: Run browser acceptance specs
        working-directory: tests/ui
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: |
          trap 'rm -f playwright.ci.config.ts' EXIT
          node -e "const fs = require('fs'); const path = 'playwright.ci.config.ts'; fs.writeFileSync(path, fs.readFileSync('playwright.config.ts', 'utf8').replace(\"testMatch: 'demo.spec.ts'\", \"testMatch: '**/*.spec.ts'\"))"
          npm test -- --config=playwright.ci.config.ts
      - name: Dump Compose status and logs
        if: always()
        run: |
          docker compose ps --all > compose-status.txt 2>&1
          docker compose logs --no-color > compose-logs.txt 2>&1
      - name: Tear down stack and volumes
        if: always()
        run: docker compose down -v
      - name: Upload browser evidence and Compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/ui/test-results/
            tests/ui/playwright-report/
            tests/ui/results.json
            compose-status.txt
            compose-logs.txt
          if-no-files-found: warn
          retention-days: 14
