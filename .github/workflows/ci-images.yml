name: ci-images

on:
  push:
    branches: [main]
    paths-ignore: ["swarm/**", "boss/**", "docs/**", "**/*.md", "web/public/expo-build.txt"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build engine image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/engine.Dockerfile
          push: false
          load: true
          tags: aether/engine:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            GITHUB_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build simulator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/simulator.Dockerfile
          push: false
          load: true
          tags: aether/simulator:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            GITHUB_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build control-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/control-api.Dockerfile
          push: false
          load: true
          tags: aether/control-api:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            GITHUB_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        if: hashFiles('web/package.json') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          load: true
          tags: aether/web:ci
          build-args: |
            VITE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Java images and revision labels
        run: |
          set -euo pipefail
          docker run --rm --entrypoint java aether/engine:ci -version
          docker run --rm --entrypoint java aether/simulator:ci -version
          docker run --rm --entrypoint java aether/control-api:ci -version
          docker image ls
          for image in aether/engine:ci aether/simulator:ci aether/control-api:ci; do
            revision="$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
            printf '%s revision: %s\n' "$image" "$revision"
            test "$revision" = "${GITHUB_SHA}"
          done

      - name: Smoke-test web image
        if: hashFiles('web/package.json') != ''
        run: docker run --rm --entrypoint nginx aether/web:ci -v
