name: ci-web

on:
  push:
    branches: [main, 'task/**']
    paths: ["web/**", ".github/workflows/ci-web.yml"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run check:no-mock
      - name: Verify mock-enabled build is rejected
        run: |
          VITE_USE_MOCK=1 npm run build -- --outDir dist-mock
          if npm run check:no-mock -- dist-mock; then
            echo "Mock-enabled build unexpectedly passed the production check"
            exit 1
          fi
          echo "Mock-enabled build correctly rejected"
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
