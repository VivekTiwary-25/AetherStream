name: ci-monitoring

on:
  push:
    branches:
      - main
      - "task/**"
    paths-ignore:
      - "swarm/**"
      - "boss/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and start engine with monitoring
        run: >-
          docker compose --profile monitoring up -d --build --wait
          coordinator worker-1 worker-2 worker-3 control-api prometheus grafana

      - name: Verify Prometheus and Grafana
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request

          PROMETHEUS = "http://localhost:19090"
          GRAFANA = "http://localhost:13000"
          CONTROL_API = "http://localhost:18080"

          def get_json(url):
              with urllib.request.urlopen(url, timeout=10) as response:
                  return json.load(response)

          def post_json(path, body):
              request = urllib.request.Request(
                  CONTROL_API + path, data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json"}, method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def wait_for_query(expression, title):
              # Grafana interpolates this macro; Prometheus itself does not.
              expression = expression.replace("$__rate_interval", "1m")
              query = urllib.parse.urlencode({"query": expression})
              deadline = time.monotonic() + 120
              while True:
                  result = get_json(PROMETHEUS + "/api/v1/query?" + query)
                  assert result["status"] == "success", result
                  samples = result["data"]["result"]
                  if samples:
                      return samples
                  assert time.monotonic() < deadline, (
                      f"Panel {title!r} query {expression!r} returned no samples"
                  )
                  time.sleep(5)

          def wait_for_targets():
              expected = {
                  "coordinator:8081",
                  "worker-1:8090",
                  "worker-2:8090",
                  "worker-3:8090",
              }
              deadline = time.monotonic() + 120
              while time.monotonic() < deadline:
                  try:
                      data = get_json(PROMETHEUS + "/api/v1/targets?state=active")
                      targets = data["data"]["activeTargets"]
                      by_address = {target["labels"].get("instance"): target for target in targets}
                      if expected.issubset(by_address) and all(
                          by_address[address]["health"] == "up" for address in expected
                      ):
                          print("Prometheus coordinator and worker targets are up:", ", ".join(sorted(expected)))
                          return
                  except (OSError, ValueError, KeyError):
                      by_address = {}
                  time.sleep(5)
              states = {address: by_address.get(address, {}).get("health", "missing") for address in expected}
              raise AssertionError(f"Prometheus targets not all up: {states}")

          wait_for_targets()

          # Assigned workers emit partition lag only after a real pipeline is running.
          demo = get_json(CONTROL_API + "/api/pipelines/demo")
          pipeline = post_json("/api/pipelines", demo)
          execution = post_json(
              "/api/pipelines/" + urllib.parse.quote(pipeline["id"], safe="") + "/executions",
              {"idempotencyKey": "ci-monitoring-smoke"},
          )
          assert execution["state"] == "RUNNING", execution
          print("Started monitoring pipeline:", execution["id"])

          samples = wait_for_query("aether_worker_records_per_sec", "Worker throughput")
          print(f"PromQL query aether_worker_records_per_sec returned {len(samples)} sample(s)")

          health = get_json(GRAFANA + "/api/health")
          assert health.get("database") == "ok", f"Grafana health is not ok: {health}"
          print("Grafana health is ok")

          search = urllib.parse.urlencode({"query": "AetherStream"})
          dashboards = get_json(GRAFANA + "/api/search?" + search)
          assert any(
              entry.get("type") == "dash-db" and "AetherStream" in entry.get("title", "")
              for entry in dashboards
          ), f"Grafana search did not find the AetherStream dashboard: {dashboards}"
          print("Grafana search found the AetherStream dashboard")

          dashboard_path = "infra/monitoring/grafana/dashboards/aetherstream.json"
          with open(dashboard_path, encoding="utf-8") as dashboard_file:
              dashboard = json.load(dashboard_file)

          checked = 0
          for panel in dashboard["panels"]:
              for target in panel.get("targets", []):
                  expression = target.get("expr", "")
                  samples = wait_for_query(expression, panel.get("title"))
                  checked += 1
                  print(f"Dashboard query returned {len(samples)} sample(s): {panel.get('title')}: {expression}")
          assert checked, "No dashboard panel metrics were checked"
          PY

      - name: Compose status
        if: always()
        run: docker compose ps -a

      - name: Collect Compose logs
        if: failure()
        run: docker compose logs --no-color > compose-monitoring-logs.txt 2>&1

      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-monitoring-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: compose-monitoring-logs.txt
          if-no-files-found: warn

      - name: Tear down stack
        if: always()
        run: docker compose down -v
